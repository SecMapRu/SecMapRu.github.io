<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Фон: Щит информационной безопасности -->
  <path d="M32 4 L54 13 C54 36 32 58 32 60 C32 58 10 36 10 13 Z" 
        fill="#0284c7" />
  
  <!-- Внутренний акцентный контур щита -->
  <path d="M32 9 L49 17 C49 35 32 52 32 54 C32 52 15 35 15 17 Z" 
        fill="#0369a1" />

  <!-- Линии сетевых связей (топология) -->
  <line x1="32" y1="21" x2="22" y2="38" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="21" x2="42" y2="38" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="38" x2="42" y2="38" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Нижние узлы сети (клиенты/серверы) -->
  <circle cx="22" cy="38" r="4.5" fill="#ffffff" />
  <circle cx="42" cy="38" r="4.5" fill="#ffffff" />

  <!-- Центральный/Верхний узел (шлюз / защищенный узел) -->
  <circle cx="32" cy="21" r="5.5" fill="#22c55e" stroke="#ffffff" stroke-width="2" />
</svg>
