<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Градиент фона -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Точечная сетка холста -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#cbd5e1"/>
    </pattern>

    <!-- Мягкие тени -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#2563eb" flood-opacity="0.5"/>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.4"/>
    </filter>

    <!-- Маркеры стрелок -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="20" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="20" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Фон и сетка -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- ================= ЛЕВАЯ ЧАСТЬ: БРЕНДИНГ ================= -->
  <g transform="translate(80, 100)">
    <!-- Бейдж бета/версии -->
    <rect width="128" height="28" rx="14" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
    <text x="64" y="18" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">SECURITY MAPPER</text>

    <!-- Главный логотип / заголовок -->
    <text x="0" y="90" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">Sec<tspan fill="#0284c7">Map</tspan></text>
    
    <!-- Дескриптор -->
    <text x="0" y="132" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="600">
      Интерактивный конструктор карт сети
    </text>
    
    <text x="0" y="165" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400">
      Визуализация микросегментации, потоков трафика,
    </text>
    <text x="0" y="190" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400">
      вложенных групп и экспорт в Draw.io &amp; SVG.
    </text>

    <!-- Фичи списком -->
    <g transform="translate(0, 240)">
      <rect width="90" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#cardShadow)"/>
      <text x="45" y="17" fill="#0369a1" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">⚡ Live Traffic</text>

      <rect x="102" width="100" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#cardShadow)"/>
      <text x="152" y="17" fill="#0f172a" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">📥 CSV Import</text>

      <rect x="214" width="85" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#cardShadow)"/>
      <text x="256" y="17" fill="#0f172a" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">📐 Draw.io</text>

      <rect x="311" width="85" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#cardShadow)"/>
      <text x="353" y="17" fill="#0f172a" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">🔗 Web-Share</text>
    </g>
  </g>

  <!-- ================= ПРАВАЯ ЧАСТЬ: ИНТЕРАКТИВНАЯ КАРТА ================= -->
  
  <!-- Внешняя родительская группа: Cloud Perimeter -->
  <g transform="translate(560, 60)">
    <rect width="570" height="490" rx="14" fill="rgba(2,132,199,0.03)" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,6"/>
    <rect width="570" height="34" rx="12" fill="rgba(2,132,199,0.12)"/>
    <text x="16" y="22" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700">🔲 Production VPC (10.0.0.0/16)</text>
  </g>

  <!-- Вложенная группа: DMZ / Ingress -->
  <g transform="translate(590, 120)">
    <rect width="230" height="230" rx="10" fill="rgba(245,158,11,0.04)" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <rect width="230" height="28" rx="8" fill="rgba(245,158,11,0.15)"/>
    <text x="12" y="19" fill="#d97706" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700">🔲 DMZ Ingress</text>
  </g>

  <!-- Вложенная группа: Secure Core -->
  <g transform="translate(865, 120)">
    <rect width="235" height="230" rx="10" fill="rgba(16,185,129,0.04)" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4"/>
    <rect width="235" height="28" rx="8" fill="rgba(16,185,129,0.15)"/>
    <text x="12" y="19" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700">🔲 Core Services</text>
  </g>

  <!-- ================= СВЯЗИ / ЛИНИИ ПОТОКОВ ================= -->
  
  <!-- Атака: Attacker -> Nginx (Красный поток) -->
  <path d="M 695 440 L 695 240" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)" filter="url(#glowRed)"/>
  <!-- Плашка порта 80 -->
  <g transform="translate(695, 345)">
    <rect x="-42" y="-11" width="84" height="22" rx="4" fill="#ffffff" stroke="#ef4444" stroke-width="1" filter="url(#cardShadow)"/>
    <text y="4" fill="#dc2626" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">[80] Exploit</text>
  </g>

  <!-- Связь 1: Nginx -> App Server (443 - HTTPS) -->
  <path d="M 755 210 Q 825 180 890 200" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" filter="url(#glowBlue)"/>
  <!-- Огоньки трафика -->
  <path d="M 755 210 Q 825 180 890 200" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="5,20"/>
  <g transform="translate(820, 180)">
    <rect x="-44" y="-10" width="88" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#cardShadow)"/>
    <text y="4" fill="#1e293b" font-family="monospace" font-size="10" text-anchor="middle">[443] Proxy</text>
  </g>

  <!-- Связь 2: App Server -> Postgres (5432 - DB Query) -->
  <path d="M 950 225 L 950 280" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" filter="url(#glowBlue)"/>
  <path d="M 950 225 L 950 280" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="5,20"/>
  <g transform="translate(950, 252)">
    <rect x="-46" y="-10" width="92" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#cardShadow)"/>
    <text y="4" fill="#1e293b" font-family="monospace" font-size="10" text-anchor="middle">[5432] Query</text>
  </g>

  <!-- ================= ХОСТЫ / УЗЛЫ ================= -->

  <!-- Хост 1: Nginx Gateway (DMZ) -->
  <g transform="translate(630, 200)">
    <rect width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="10" y="21" font-size="14">🌐</text>
    <text x="32" y="20" fill="#0f172a" font-family="monospace" font-size="11" font-weight="700">192.168.1.1</text>
  </g>

  <!-- Хост 2: App Server (Core) -->
  <g transform="translate(885, 190)">
    <rect width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="10" y="21" font-size="14">🖳</text>
    <text x="32" y="20" fill="#0f172a" font-family="monospace" font-size="11" font-weight="700">10.0.0.5</text>
  </g>

  <!-- Хост 3: Postgres DB (Core) -->
  <g transform="translate(885, 285)">
    <rect width="130" height="32" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="10" y="21" font-size="14">🗄️</text>
    <text x="32" y="20" fill="#0f172a" font-family="monospace" font-size="11" font-weight="700">10.0.0.20</text>
  </g>

  <!-- Хост 4: Вредоносный узел (Вне периметра) -->
  <g transform="translate(630, 440)">
    <rect width="130" height="32" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="10" y="21" font-size="14">😈</text>
    <text x="32" y="20" fill="#991b1b" font-family="monospace" font-size="11" font-weight="700">198.51.100.66</text>
  </g>

  <!-- Декоративная плашка агрегации пакетов -->
  <g transform="translate(860, 445)">
    <rect width="200" height="26" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,3" filter="url(#cardShadow)"/>
    <text x="100" y="17" fill="#0284c7" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">📦 [12 портов: 80, 443, ...]</text>
  </g>
</svg>
